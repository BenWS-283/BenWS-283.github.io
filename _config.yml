remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: default
title: "Ben Sedran | Engineering Portfolio"
url: "https://benWS-283.github.io"
baseurl: ""
author:
  name: "Your Name"
  avatar: "/assets/images/profile.jpg"
  bio: "Mechanical engineering student interested in..."
  location: "Ithaca, NY"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/BenWS-283"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/yourprofile"
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache
collections:
  projects:
    output: true
    permalink: /:collection/:path/
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      toc: true
      author_profile: true