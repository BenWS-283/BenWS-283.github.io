remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: default
title: "Your Name | Mechanical Engineering Portfolio"
url: "https://yourusername.github.io"
baseurl: ""
author:
  name: "Your Name"
  bio: "Mechanical engineering student..."
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-remote-theme
  - jekyll-feed
collections:
  projects:
    output: true
    permalink: /:collection/:path/
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      toc: true
      author_profile: true